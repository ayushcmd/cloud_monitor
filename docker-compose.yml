name: cloudmonitor

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cloudmonitor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - cloudmonitor-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: cloudmonitor-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - cloudmonitor-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cloudmonitor-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
    command:
      - '--docker='
      - '--containerd=/var/run/containerd/containerd.sock'
      - '--containerd-namespace=moby'
      - '--disable_metrics=disk,tcp,udp,percpu'
      - '--housekeeping_interval=10s'
    networks:
      - cloudmonitor-net

  backend:
    image: cloudmonitor-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudmonitor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CloudMonitor-API
      - APP_ENV=development
      - PORT=8000
    networks:
      - cloudmonitor-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cloudmonitor-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - cloudmonitor-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cloudmonitor-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    networks:
      - cloudmonitor-net
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    profiles: ["frontend"]
    image: cloudmonitor-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudmonitor-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    networks:
      - cloudmonitor-net

networks:
  cloudmonitor-net:
    driver: bridge
    name: cloudmonitor-network

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
