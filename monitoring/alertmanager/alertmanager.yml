global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'severity', 'component']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'cloudmonitor-default-log'
  routes:
    - match:
        severity: critical
      receiver: 'cloudmonitor-critical-receiver'
      continue: true

receivers:
  - name: 'cloudmonitor-default-log'
    webhook_configs: []

  - name: 'cloudmonitor-critical-receiver'
    webhook_configs: []
